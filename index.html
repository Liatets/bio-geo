<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Биология ОГЭ · Тренажёр и 3D</title>
  <script>
    (function () {
      try {
        var hp = new URLSearchParams(location.hash.slice(1));
        var tp = hp.get("tgWebAppThemeParams");
        if (tp) {
          var bg = JSON.parse(tp).bg_color;
          if (bg && /^#[0-9a-f]{6}$/i.test(bg)) {
            var n = parseInt(bg.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
            document.documentElement.dataset.theme = (0.2126 * r + 0.7152 * g + 0.0722 * b) < 128 ? "dark" : "light";
          }
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #F4F7F4; --paper: #FFFFFF; --grid: #E3EDE4; --ink: #16241B; --ink-2: #526659;
      --line: #D2E0D5; --surface: #FFFFFF; --surface-2: #EAF2EC;
      --accent: #2E8B57; --accent-soft: #E0F2E7; --on-accent: #FFFFFF;
      --ok: #24804E; --ok-soft: #DCF2E5; --bad: #C0392B; --bad-soft: #FBE6E3;
      --shadow: 0 2px 10px rgba(22, 36, 27, 0.06);
      --font-display: "Unbounded", system-ui, sans-serif;
      --font-body: "Onest", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
      --tg-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
      --tg-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
    }
    :root[data-theme="dark"] {
      --bg: #0E1511; --paper: #141E18; --grid: #1D2B22; --ink: #E6F0E9; --ink-2: #94AB9C;
      --line: #27382D; --surface: #17231C; --surface-2: #1E2E25;
      --accent: #4CC380; --accent-soft: #183625; --on-accent: #0B1A11;
      --ok: #5CCB8C; --ok-soft: #17321F; --bad: #F2786B; --bad-soft: #3A1D1A;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; color: inherit; }
    .wrap {
      max-width: 960px; margin: 0 auto;
      padding: calc(16px + var(--tg-top)) 16px calc(48px + var(--tg-bottom));
    }

    /* Шапка */
    .head { display: grid; gap: 12px; margin-bottom: 16px; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand h1 { margin: 0; font: 700 clamp(20px, 5vw, 28px)/1.1 var(--font-display); }
    .badge { font: 600 12px/1 var(--font-mono); padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

    /* Вкладки */
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
    .tabs button { border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; font: 600 13px/1.2 var(--font-body); color: var(--ink-2); cursor: pointer; transition: background .2s, color .2s; }
    .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

    /* Прогресс-бар */
    .prog-card { padding: 14px 16px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); margin-bottom: 14px; display: grid; gap: 8px; }
    .prog-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; font-weight: 600; flex-wrap: wrap; }
    .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); transition: width 0.3s ease; }

    /* Блок 3D-лабораторий */
    .lab3d-grid { display: grid; gap: 10px; margin-bottom: 16px; grid-template-columns: 1fr; }
    @media (min-width: 680px) { .lab3d-grid { grid-template-columns: repeat(3, 1fr); } }
    .anat-banner {
      width: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
      padding: 14px 16px; border: 0; border-radius: 18px; cursor: pointer; text-align: left;
      background: linear-gradient(135deg, #122e22 0%, #09140f 100%); color: #eaf7ef;
      box-shadow: 0 8px 20px rgba(14, 40, 26, 0.2);
    }
    .anat-banner.heart-bg { background: linear-gradient(135deg, #3a121b 0%, #14080b 100%); }
    .anat-banner.lungs-bg { background: linear-gradient(135deg, #12253a 0%, #081018 100%); }
    .anat-banner:active { transform: scale(0.99); }
    .anat-banner b { display: block; font: 700 15px/1.2 var(--font-display); }
    .anat-banner small { display: block; margin-top: 4px; font-size: 12.5px; color: rgba(234,247,239,0.78); line-height: 1.35; }
    .anat-banner-go { align-self: flex-start; padding: 7px 12px; border-radius: 10px; background: #4cc380; color: #081c11; font-weight: 700; font-size: 12px; }
    .anat-banner.heart-bg .anat-banner-go { background: #ff6b81; color: #1f060a; }
    .anat-banner.lungs-bg .anat-banner-go { background: #56ccf2; color: #061722; }

    /* Поиск и фильтр */
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
    .search-in {
      flex: 1 1 200px; padding: 10px 12px; border-radius: 12px;
      border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px;
    }
    .search-in:focus { outline: none; border-color: var(--accent); }
    .filter-btn {
      padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line);
      background: var(--surface); font: 600 13px/1 var(--font-body); color: var(--ink-2); cursor: pointer;
    }
    .filter-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

    /* Разделы и карточки */
    .sec { margin-bottom: 24px; }
    .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .sec-head h2 { margin: 0; font: 700 16px/1.25 var(--font-display); color: var(--accent); }
    .sec-tasks { font: 500 12px/1.2 var(--font-mono); color: var(--ink-2); }
    .grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
    @media (min-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .card { padding: 14px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: grid; gap: 8px; }
    .card.ready { border-color: var(--accent); background: var(--paper); }
    .card-title { font-weight: 700; font-size: 15.5px; line-height: 1.3; }
    .card-desc { margin: 0; font-size: 13.5px; color: var(--ink-2); }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--line); flex-wrap: wrap; }

    /* Статусы Изучено / Повторено */
    .statuses { display: flex; gap: 8px; font-size: 12px; font-weight: 600; flex-wrap: wrap; }
    .st-pill { padding: 4px 8px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); }
    .st-pill.ok { background: var(--ok-soft); color: var(--ok); }

    /* Компактный чек-лист */
    .chk-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .chk-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .chk-row:first-child { padding-top: 0; }
    .chk-name { font-size: 14px; line-height: 1.35; }
    .chk-name.done { color: var(--ok); font-weight: 600; }

    /* Кнопки */
    .btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 10px; font: 600 13px/1 var(--font-body); cursor: pointer; white-space: nowrap; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .card-acts { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Тетрадный лист теории и тренажёра */
    .sheet {
      background-color: var(--paper);
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 20px 20px; border: 1.5px solid var(--line); border-radius: 18px; padding: 18px;
    }
    .theory-body { display: grid; gap: 12px; font-size: 15px; line-height: 1.55; }
    .theory-body h3 { margin: 6px 0 0; font: 700 15px/1.3 var(--font-display); color: var(--accent); }
    .theory-body p { margin: 0; }
    .theory-body ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
    .q-title { margin: 0 0 14px; font: 700 17px/1.35 var(--font-body); }
    .opts { display: grid; gap: 8px; }
    .opt { width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 500; cursor: pointer; }
    .opt.good { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 700; }
    .opt.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
    .trap { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; }
    .trap b { display: block; font: 600 11px/1.2 var(--font-mono); text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }

    /* Таблица заданий ОГЭ */
    .oge-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); font-size: 13.5px; }
    .oge-table th, .oge-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .oge-table th { background: var(--surface-2); font: 600 12px var(--font-mono); color: var(--ink-2); }

    /* Полноэкранный 3D-просмотрщик */
    .anat-ov { position: fixed; inset: 0; z-index: 999; background: #0b1210; color: #eef7f1; }
    .anat-ui-top {
      position: absolute; top: calc(10px + var(--tg-top)); left: 10px; right: 10px; z-index: 3;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px;
    }
    .anat-btn { padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,24,20,0.85); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; backdrop-filter: blur(8px); }
    .anat-btn.accent { background: #4cc380; color: #081c11; border-color: #4cc380; }
    .anat-layers { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(15,24,20,0.85); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px); }
    .anat-tab { border: 0; background: transparent; color: #9fc5ae; padding: 6px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .anat-tab.on { background: #4cc380; color: #081c11; }
    .anat-controls {
      position: absolute; top: calc(56px + var(--tg-top)); left: 10px; right: 10px; z-index: 3;
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; pointer-events: none;
    }
    .anat-controls > * { pointer-events: auto; }
    .anat-card {
      position: absolute; left: 12px; right: 12px; bottom: calc(14px + var(--tg-bottom)); z-index: 3;
      max-width: 560px; margin: 0 auto; padding: 14px 16px; border-radius: 18px;
      background: rgba(16, 26, 21, 0.92); border: 1px solid rgba(76, 195, 128, 0.35); backdrop-filter: blur(10px);
    }
    .anat-kicker { display: block; font: 600 10.5px/1 var(--font-mono); color: #4cc380; letter-spacing: 0.08em; margin-bottom: 4px; }
    .anat-card b { display: block; font-size: 16px; margin-bottom: 4px; }
    .anat-card p { margin: 0; font-size: 13px; color: #c5dfd0; line-height: 1.4; }
    .anat-trap { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(76, 195, 128, 0.16); color: #8ff0b7; font-size: 12.5px; font-weight: 500; }

    /* Всплывающее уведомление */
    .toast {
      position: fixed; left: 16px; right: 16px; bottom: calc(20px + var(--tg-bottom));
      margin: 0 auto; width: fit-content; max-width: 420px; z-index: 1000;
      padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 13.5px;
      box-shadow: var(--shadow);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="brand">
        <h1>Биология ОГЭ</h1>
        <span class="badge" id="topic-count-badge">139 тем</span>
      </div>
      <div class="tabs" id="main-tabs">
        <button type="button" data-tab="modules" aria-pressed="true">Тренажёр</button>
        <button type="button" data-tab="checklist" aria-pressed="false">Весь чек-лист</button>
        <button type="button" data-tab="exam" aria-pressed="false">Задания ОГЭ</button>
      </div>
    </header>

    <div class="prog-card" id="prog-box"></div>

    <div class="lab3d-grid" id="lab3d-grid">
      <button type="button" class="anat-banner" data-open3d="body">
        <div>
          <b>Тело человека в 3D</b>
          <small>Детальный скелет (12 пар рёбер, S-позвоночник) и внутренние органы</small>
        </div>
        <span class="anat-banner-go">Открыть 3D →</span>
      </button>
      <button type="button" class="anat-banner heart-bg" data-open3d="heart">
        <div>
          <b>Сердце и укол в руку</b>
          <small>Круги кровообращения и путь лекарства от вены руки до органов</small>
        </div>
        <span class="anat-banner-go">Запустить путь →</span>
      </button>
      <button type="button" class="anat-banner lungs-bg" data-open3d="lungs">
        <div>
          <b>Лёгкие и дыхание</b>
          <small>Механизм вдоха и выдоха: диафрагма, рёбра, трахея и газообмен</small>
        </div>
        <span class="anat-banner-go">Смотреть вдох →</span>
      </button>
    </div>

    <div class="toolbar" id="toolbar">
      <input type="search" class="search-in" id="search-in" placeholder="Поиск по 139 темам (например: сердце, дыхание, мхи)...">
      <button type="button" class="filter-btn" id="filter-ready" aria-pressed="false">Только с теорией и тестами</button>
    </div>

    <main id="view-modules"></main>
    <section id="view-checklist" hidden></section>
    <section id="view-exam" hidden></section>
    <section id="view-theory" hidden></section>
    <section id="view-quiz" hidden></section>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="content.js"></script>
  <script src="engine.js"></script>
</body>
</html>
